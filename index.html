<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema Isidora — Horario y Hábitos</title>
<style>
  :root{
    --ink:#22281E;
    --ink-soft:#3A4234;
    --paper:#F4F1EA;
    --paper-dim:#E7E1CC;
    --moss:#4B5842;
    --moss-light:#6E7C61;
    --rust:#7A3B22;
    --brass:#B08D4F;
    --line: rgba(34,40,30,0.15);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--ink);
    font-family: Georgia, 'Iowan Old Style', serif;
    min-height:100vh;
  }
  header{
    padding:20px 24px 14px;
    border-bottom:1px solid rgba(244,241,234,0.2);
  }
  header h1{color:var(--paper); margin:0 0 2px; font-weight:400; font-size:1.5rem; letter-spacing:0.02em;}
  header p{color:var(--brass); margin:0; font-style:italic; font-size:0.85rem;}

  nav{
    display:flex; flex-wrap:wrap; gap:4px;
    padding:10px 20px; background:var(--ink);
    border-bottom:1px solid rgba(244,241,234,0.15);
  }
  nav button{
    background:transparent; border:1px solid rgba(244,241,234,0.3);
    color:var(--paper); padding:7px 14px; border-radius:3px;
    font-family:inherit; font-size:0.82rem; cursor:pointer; letter-spacing:0.02em;
  }
  nav button.active{ background:var(--moss); border-color:var(--moss); }

  main{ padding:20px; max-width:1000px; margin:0 auto; }
  .panel{
    background:var(--paper); border-radius:4px; padding:20px 24px;
    box-shadow:0 6px 0 rgba(0,0,0,0.15); margin-bottom:20px; display:none;
  }
  .panel.active{ display:block; }
  .panel h2{ margin-top:0; font-size:1.15rem; border-bottom:2px solid var(--moss); padding-bottom:8px; }
  .hint{ font-size:0.8rem; color:var(--ink-soft); font-style:italic; margin-bottom:14px; }

  input[type=date], textarea{
    font-family:inherit; border:1px solid var(--line); background:rgba(255,255,255,0.5);
    padding:6px 8px; border-radius:2px; font-size:0.85rem;
  }
  textarea{ width:100%; min-height:44px; resize:vertical; }

  .schedule-block{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:14px; }
  .schedule-block .day{ border:1px solid var(--line); border-radius:3px; padding:8px; font-size:0.76rem; background:rgba(255,255,255,0.4);}
  .schedule-block .day h4{ margin:0 0 6px; font-size:0.82rem; color:var(--moss); }
  .schedule-block .day .item{ margin-bottom:3px; }
  @media (max-width:800px){ .schedule-block{ grid-template-columns:repeat(2,1fr); } }

  .stats-row{ display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  .stat-card{
    background:rgba(255,255,255,0.5); border:1px solid var(--line); border-radius:4px;
    padding:12px 18px; text-align:center; min-width:140px;
  }
  .stat-card .num{ font-size:1.8rem; font-weight:700; color:var(--moss); }
  .stat-card .label{ font-size:0.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em; }

  .habit-grid{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .habit-row{
    border:1px solid var(--line); border-radius:3px; background:rgba(255,255,255,0.4);
    padding:10px 14px;
  }
  .habit-row .title{ font-weight:700; margin-bottom:6px; font-size:0.88rem; }
  .habit-row .sub-options{ display:flex; flex-wrap:wrap; gap:10px; }
  .habit-row label{ display:flex; align-items:center; gap:5px; font-size:0.82rem; }
  .habit-row.simple label{ font-size:0.9rem; }
  input[type=checkbox]{ width:16px; height:16px; accent-color:var(--moss); }
  .habit-row.disabled{ opacity:0.4; }
  .weekly-summary{
    display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:16px;
  }
  .weekly-summary .wday{ text-align:center; font-size:0.7rem; }
  .weekly-summary .dot{
    width:22px; height:22px; border-radius:50%; margin:2px auto; background:var(--paper-dim); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:0.65rem;
  }
  .weekly-summary .dot.done{ background:var(--moss); color:white; }
  .status{ font-size:0.72rem; color:var(--brass); min-height:14px; margin-top:6px; }
</style>
</head>
<body>

<header>
  <h1>Sistema Isidora</h1>
  <p>Horario y Hábitos · Julio — Diciembre 2026</p>
</header>

<nav id="tabs"></nav>
<main id="panels"></main>

<script>
const TABS = [
  {id:'habitos', label:'Hábitos'},
  {id:'horario', label:'Horario'},
];
const STORAGE_KEY = 'isidora-sistema-2026';

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { habitos: {} };
}
let data = loadData();
function saveData(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }catch(e){ return false; } }
function todayStr(d){ d = d || new Date(); return d.toISOString().slice(0,10); }
function dateFromStr(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function weekdayOf(s){ return dateFromStr(s).getDay(); } // 0=domingo..6=sabado

// ---------- HABIT DEFINITIONS ----------
const DEPORTE_OPTIONS = ['Preparación Física','Halterofilia','Nike Run Club','Caminar','Padel','Cerro','Otro'];
const HABITOS_DEF = [
  {id:'deporte', label:'Deporte', type:'multi', options:DEPORTE_OPTIONS, dias:'all'},
  {id:'temporizador', label:'Temporizador 30 min (sin celular)', type:'check', dias:'all'},
  {id:'agua', label:'Agua antes de la bebida', type:'check', dias:'all'},
  {id:'cama', label:'Hacer la cama', type:'check', dias:'all'},
  {id:'mindfulness', label:'Mindfulness', type:'check', dias:[1,3,5]},
  {id:'ingles', label:'Inglés (ELSA Speak)', type:'check', dias:[1,2,3,4]},
];

function isObligatorio(h, wd){
  if(h.dias==='all') return true;
  return h.dias.includes(wd);
}

let currentDate = todayStr();

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  TABS.forEach((t,i)=>{
    const b = document.createElement('button');
    b.textContent = t.label;
    b.dataset.tab = t.id;
    if(i===0) b.classList.add('active');
    b.addEventListener('click', ()=> switchTab(t.id));
    nav.appendChild(b);
  });
}
function switchTab(id){
  document.querySelectorAll('nav button').forEach(b=> b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.id==='panel-'+id));
}

function renderPanels(){
  const main = document.getElementById('panels');
  main.innerHTML = TABS.map(t=>`<div class="panel${t.id==='habitos'?' active':''}" id="panel-${t.id}"></div>`).join('');
  renderHabitos();
  renderHorario();
}

function habitCompleted(entry, def){
  if(!entry) return false;
  if(def.type==='multi'){
    return Array.isArray(entry[def.id]) && entry[def.id].length>0;
  }
  return !!entry[def.id];
}
function dayFullyCompleted(dateStr){
  const wd = weekdayOf(dateStr);
  const entry = data.habitos[dateStr];
  return HABITOS_DEF.every(h=>{
    if(!isObligatorio(h, wd)) return true;
    return habitCompleted(entry, h);
  });
}
function computeStreak(){
  let streak = 0;
  let d = new Date();
  for(let i=0; i<3650; i++){
    const ds = todayStr(d);
    const wd = d.getDay();
    const hasObligatorios = HABITOS_DEF.some(h=>isObligatorio(h, wd));
    if(hasObligatorios){
      if(dayFullyCompleted(ds)){
        streak++;
      } else {
        if(ds===todayStr() && !data.habitos[ds]){
          // hoy sin datos aun, no rompe racha, sigue a ayer
        } else {
          break;
        }
      }
    }
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function computeWeekPercentage(){
  const now = new Date();
  const wd = now.getDay();
  const diffToMonday = (wd===0? -6 : 1-wd);
  const monday = new Date(now); monday.setDate(now.getDate()+diffToMonday);
  let totalReq=0, totalDone=0;
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    if(d>now) continue;
    const ds = todayStr(d);
    const wdi = d.getDay();
    HABITOS_DEF.forEach(h=>{
      if(isObligatorio(h, wdi)){
        totalReq++;
        if(habitCompleted(data.habitos[ds], h)) totalDone++;
      }
    });
  }
  if(totalReq===0) return 0;
  return Math.round((totalDone/totalReq)*100);
}

function renderHabitos(){
  const p = document.getElementById('panel-habitos');
  const wd = weekdayOf(currentDate);
  const entry = data.habitos[currentDate] || {};
  const streak = computeStreak();
  const pct = computeWeekPercentage();

  p.innerHTML = `
    <h2>Hábitos diarios</h2>
    <p class="hint">Marca lo que cumpliste. Se guarda solo.</p>
    <div class="stats-row">
      <div class="stat-card"><div class="num">🔥 ${streak}</div><div class="label">Racha de días</div></div>
      <div class="stat-card"><div class="num">${pct}%</div><div class="label">Cumplimiento esta semana</div></div>
    </div>
    <input type="date" id="habit-date" value="${currentDate}">
    <div class="habit-grid" id="habit-grid" style="margin-top:14px;"></div>
    <div class="status" id="habit-status"></div>
    <p class="hint" style="margin-top:10px;">Últimos 7 días:</p>
    <div class="weekly-summary" id="weekly-summary"></div>
  `;

  const grid = document.getElementById('habit-grid');
  HABITOS_DEF.forEach(h=>{
    const obligatorio = isObligatorio(h, wd);
    const row = document.createElement('div');
    row.className = 'habit-row' + (obligatorio? '' : ' disabled');
    if(h.type==='multi'){
      row.innerHTML = `<div class="title">${h.label} ${obligatorio?'':'<em>(opcional hoy)</em>'}</div>
        <div class="sub-options">${h.options.map(opt=>{
          const checked = (entry[h.id]||[]).includes(opt);
          return `<label><input type="checkbox" data-h="${h.id}" data-opt="${opt}" ${checked?'checked':''}> ${opt}</label>`;
        }).join('')}</div>`;
    } else {
      row.classList.add('simple');
      const checked = !!entry[h.id];
      row.innerHTML = `<label><input type="checkbox" data-h="${h.id}" ${checked?'checked':''}> ${h.label} ${obligatorio?'':'<em>(opcional hoy)</em>'}</label>`;
    }
    grid.appendChild(row);
  });

  grid.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(!data.habitos[currentDate]) data.habitos[currentDate] = {};
      const hid = cb.dataset.h;
      const def = HABITOS_DEF.find(x=>x.id===hid);
      if(def.type==='multi'){
        const opt = cb.dataset.opt;
        let arr = data.habitos[currentDate][hid] || [];
        if(cb.checked){ if(!arr.includes(opt)) arr.push(opt); }
        else { arr = arr.filter(o=>o!==opt); }
        data.habitos[currentDate][hid] = arr;
      } else {
        data.habitos[currentDate][hid] = cb.checked;
      }
      saveData();
      flash('habit-status');
      renderHabitos();
    });
  });

  document.getElementById('habit-date').addEventListener('change', e=>{
    currentDate = e.target.value;
    renderHabitos();
  });

  const ws = document.getElementById('weekly-summary');
  ws.innerHTML = '';
  const dayLetters = ['D','L','M','X','J','V','S'];
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    days.push(d);
  }
  days.forEach(d=>{
    const ds = todayStr(d);
    const wdi = d.getDay();
    const hasReq = HABITOS_DEF.some(h=>isObligatorio(h,wdi));
    const done = hasReq ? dayFullyCompleted(ds) : null;
    const col = document.createElement('div');
    col.innerHTML = `<div class="wday">${dayLetters[wdi]}<br>${d.getDate()}</div><div class="dot ${done?'done':''}">${done===null?'–':(done?'✓':'')}</div>`;
    ws.appendChild(col);
  });
}

function flash(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent = 'Guardado.';
  setTimeout(()=>{ if(el.textContent==='Guardado.') el.textContent=''; }, 1500);
}

const HORARIO = {
  'Lunes': [
    'Mindfulness 8:00–8:10',
    'Preparación Física 8:20–9:30',
    'Manejo de Riesgo en Proyectos 9:40–10:50',
    'Halterofilia 11:00–12:10',
    'Gestión Estratégica de Empresas Mineras 12:20–13:30',
    'Almuerzo 13:30–14:50',
    'Taller de Ing. Industrial en Construcción 14:50–16:10',
  ],
  'Martes': [
    'Mindfulness 8:00–8:10 (opcional)',
    'Nike Run Club (hora libre)',
  ],
  'Miércoles': [
    'Mindfulness 8:00–8:10',
    'Preparación Física 8:20–9:30',
    'Manejo de Riesgo en Proyectos 9:40–10:50',
    'Halterofilia 11:00–12:10',
    'Gestión Estratégica de Empresas Mineras 12:20–13:30',
  ],
  'Jueves': [
    'Mindfulness 8:00–8:10 (opcional)',
    'Nike Run Club (hora libre)',
  ],
  'Viernes': [
    'Mindfulness 8:00–8:10',
    'Preparación Física 8:20–9:30',
    'Taller de Ing. Ind. en Construcción 9:40–10:50 *',
    'Halterofilia 11:00–12:10',
    'Almuerzo 13:30–14:50',
    'Evaluación de Proyectos 14:50–18:40',
  ],
  'Sábado': [
    'Mindfulness (opcional)',
    'Entrenamiento libre: caminar / padel / cerro / Nike Run Club / otro',
  ],
  'Domingo': [
    'Mindfulness (opcional)',
    'Descanso fijo — sin exigencia de deporte',
  ],
};

function renderHorario(){
  const p = document.getElementById('panel-horario');
  p.innerHTML = `
    <h2>Horario semanal</h2>
    <div class="schedule-block" id="schedule"></div>
    <p class="hint">* El Taller de Ing. Industrial en Construcción del viernes tiene tope de horario temporal — se ajustará en unas semanas.</p>
  `;
  const sb = document.getElementById('schedule');
  Object.entries(HORARIO).forEach(([day, items])=>{
    const div = document.createElement('div');
    div.className='day';
    div.innerHTML = `<h4>${day}</h4>` + items.map(i=>`<div class="item">${i}</div>`).join('');
    sb.appendChild(div);
  });
}

renderTabs();
renderPanels();
</script>
</body>
</html>
